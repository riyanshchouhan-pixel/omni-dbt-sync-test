    format: ID

  canonical_url:
    description: canonical_url of the experience

  is_no_index:
    description: an experience can either have a value of 0 or 1 for no_index

  is_hidden:
    description: an experience can either have a value of 0 or 1 for is_hidden

  city:
    description: name of the primary city the experience belongs to

  mapped_cities:
    description: array of all cities (primary and secondary) mapped to the experience

  url:
    description: headout url of the experience

  image_url:
    description: url of the primary image of the experience

  currency:
    description: local currency for the experience

  pricing_type:
    description: type of pricing for the experience

  minimum_price:
    description: minimum price for the experience for days where inventory is available

  tags:
    description: an array of display tags added to the experience along with the position

  micro_brands_descriptors:
    description: an array of MB descriptors added to the experience

  average_rating:
    description: the current rating for the experience

  count_ratings:
    description: number of ratings added for the experience

  count_images:
    description: number of image urls on experience page

  image_urls:
    description: an array of image urls on experience page

