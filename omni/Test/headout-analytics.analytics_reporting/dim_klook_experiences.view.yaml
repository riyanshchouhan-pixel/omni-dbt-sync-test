# Reference this view as headout_analytics_analytics_reporting__dim_klook_experiences
description: None

catalog: headout-analytics
schema: analytics_reporting
table_name: dim_klook_experiences

dimensions:
  experience_id:
    format: ID
    description: unique id for each experience on Klook

  experience_name:
    description: name of the experience on Klook

  experience_url:
    description: URL of the experience on Klook can be accessed via -
      'klook.com/activity/{experience_id}-{url}'

  country:
    description: destination country name of the experience

  city:
    description: destination city name of the experience

  category:
    description: category of the experience on Klook (template)

  sub_category:
    description: sub category of the experience on Klook (tag)

  bookings:
    description: number of bookings the experience has had

  ratings:
    description: number of ratings the experience has gotten

  average_rating:
    description: average rating the experience has

  extractions:
    description: an array of dates the experience has been scraped Klook

  extractions_average_rating:
    sql: average_rating
    description: average rating of the experience as of the extraction date
    nested_on_field: extractions
    parent_field: extractions

  extractions_bookings:
    sql: bookings
    description: number of bookings the experience had as of the extraction date
    nested_on_field: extractions
    parent_field: extractions

  extractions_change_in_bookings:
    sql: change_in_bookings
    description: change in bookings for the experience since the last extraction date
    nested_on_field: extractions
    parent_field: extractions

  extractions_change_in_ratings:
    sql: change_in_ratings
    description: change in ratings for the experience since the last extraction date
    nested_on_field: extractions
    parent_field: extractions

  extractions_daily_change_in_bookings:
    sql: daily_change_in_bookings
    description: ∆ in bookings for the experience since the last extraction,
      normalized using the number of days since last extraction.
    nested_on_field: extractions
    parent_field: extractions

  extractions_daily_change_in_ratings:
    sql: daily_change_in_ratings
    description: ∆ in ratings for the experience since the last extraction,
      normalized using the number of days since last extraction.
    nested_on_field: extractions
    parent_field: extractions

  extractions_days_since_last_extraction:
    sql: days_since_last_extraction
    description: number of days since the experience was last extraxcted from get your guide
    nested_on_field: extractions
    parent_field: extractions

  extractions_extraction_date:
    sql: extraction_date
    description: extraction date (utc)
    nested_on_field: extractions
    parent_field: extractions

  extractions_ratings:
    sql: ratings
    description: number of ratings the experience had as of the extraction date
    nested_on_field: extractions
    parent_field: extractions

  is_best_seller:
    description: bool specifying whether the experience is a bestseller for Klook

  is_new_experience:
    description: bool specifying whether the experience is a new one on Klook

  is_sold_out:
    description: bool specifying whether the experience is sold out

  last_extracted_at:
    description: ts at which the experience was last extracted

measures:
  count:
    aggregate_type: count
