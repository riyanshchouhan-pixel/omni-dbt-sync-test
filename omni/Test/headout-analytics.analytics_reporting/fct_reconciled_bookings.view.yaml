  invoice_id:
    format: ID
    description: Comma-separated invoice IDs associated with the reconciliation
      records for this booking.

  sp_net:
    description: Comma-separated supply partner net prices as recorded on the
      reconciliation records for this booking.

  sum_total_amount_payable:
    description: Total amount payable to the supply partner for this booking, summed
      across all reconciled fulfilments. In the booking's processing currency
      (see `processing_currency` for denomination).

  sum_balance_amount_payable:
    description: Outstanding balance still payable to the supply partner for this
      booking, summed across all reconciled fulfilments. In the booking's
      processing currency (see `processing_currency` for denomination).

  sum_total_amount_paid:
    description: Total amount paid to the supply partner for this booking, summed
      from reconciliation_actions entries across all fulfilments. In the
      booking's processing currency (see `processing_currency` for
      denomination).

  concat_utr:
    description: Comma-separated UTR (Unique Transaction Reference) numbers from all
      payment action entries for this booking.

  concat_date_of_payment:
    description: Comma-separated payment dates from all payment action entries for
      this booking.

  dispute_status:
    description: Comma-separated dispute statuses across all reconciliation records
      for this booking.

  sum_total_dispute_amount:
    description: Total dispute amount raised for this booking, summed across all
      reconciled fulfilments. In the booking's processing currency (see
      `processing_currency` for denomination).

  sum_total_dispute_adjustment_amount:
    description: Total dispute adjustment amount applied for this booking, summed
      from reconciliation_actions entries across all fulfilments. In the
      booking's processing currency (see `processing_currency` for
      denomination).

  sum_total_discrepancy_amount:
    description: Total discrepancy amount for this booking, summed from
      reconciliation_actions entries across all fulfilments. In the booking's
      processing currency (see `processing_currency` for denomination).

  sum_balance_dispute_amount:
    description: |-
      Remaining unresolved dispute amount at booking level, in the booking's processing currency (see `processing_currency` for denomination). Summed across fulfilments.
      Computed as: total_dispute_amount - total_dispute_adjustment_amount - total_discrepancy_amount.
      NULL when no dispute has been raised (total_dispute_amount is NULL); 0 when fully resolved.

  concat_dispute_amount_adjusted_invoice_id:
    format: ID
    description: Comma-separated invoice IDs against which dispute adjustments have
      been applied, across all fulfilments for this booking.

  supply_partner_id:
    format: ID
    description: Vendor which is responsible for the experience.

  supply_partner_billing_entity_id:
    format: ID
    description: billing_entity which is responsible for the experience.

  supply_partner_billing_entity_name:
    description: supply partner billing entity name

  supply_partner_name:
    description: Vendor name associated with the vendor_id.

  payment_method:
    description: Payment Method associated with the vendor.

  payment_basis:
    description: Payment basis on which booking is based.

measures:
  count:
    aggregate_type: count
