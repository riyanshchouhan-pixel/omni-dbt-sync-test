# Reference this view as headout_analytics_analytics_reporting__fct_checkout_fraud_payments
description: None

catalog: headout-analytics
schema: analytics_reporting
table_name: fct_checkout_fraud_payments

dimensions:
  surrogate_key:
    description: surrogate key built by using order id

  reported_date:
    description: The date (UTC) on which the fraud was reported by the customer

  payment_date:
    description: The date (UTC) on which the original payment reported as fraud was created.

  payment_id:
    format: ID
    description: payment id for the payment which was reported fraud

  order_id:
    format: ID
    description: headout order id for the order for which the payment was created

  payment_method:
    description: payment method used for making the payment (visa, mastercard etc.)

  source:
    description: source from where the payment was marked fraudulent

measures:
  count:
    aggregate_type: count
