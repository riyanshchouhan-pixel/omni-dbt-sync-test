# Reference this view as headout_analytics_analytics_reporting__plugin_booking_fulfillment_attempts
description: None

catalog: headout-analytics
schema: analytics_reporting
table_name: plugin_booking_fulfillment_attempts

dimensions:
  event_id:
    format: ID
    description: Unique id of the event (source `id` field from the event pipeline).
      One row per plugin booking attempt.

  event_timestamp:
    description: Timestamp (UTC) at which the plugin booking attempt event was
      emitted by the fulfilment service.

  event_date:
    description: Date (UTC) of `event_timestamp`. Partition column.

  server_timestamp:
    description: Timestamp (UTC) at which the event pipeline server received the event.

  consumer_timestamp:
    description: Timestamp (UTC) at which the event was consumed into BigQuery by
      the event pipeline.

  event_name:
    description: "Name of the event. One of: `plugin_booking_success`,
      `plugin_booking_failure`."

  status:
    description: "Outcome of the plugin booking attempt. One of: `SUCCESS`, `FAIL`."

  api_name:
    description: Vendor integration plugin used for the booking attempt (e.g. BOKUN,
      VENTRATA, TourCMS, INGRESSO).

  booking_id:
    format: ID
    description: Headout booking id the attempt was made for. A single booking_id
      can have multiple attempts (retries).

  tour_id:
    format: ID
    description: Headout tour id the booking attempt targets.

  experience_id:
    format: ID
    description: Headout experience id the tour belongs to (denormalized from `dim_tours`).

  experience_name:
    description: Name of the experience booked (denormalized from `dim_tours`).

  vendor_id:
    format: ID
    description: Headout vendor id the booking attempt is fulfilled by.

  vendor_name:
    description: Name of the vendor (denormalized from `dim_vendors`).

  fulfilment_id:
    format: ID
    description: Headout fulfilment id associated with the booking attempt. Null for
      all events prior to April 2025 (the backend started emitting this field in
      2025-04, reaching full coverage from November 2025 onwards).

  booking_duration_ms:
    description: Time taken by the plugin to complete the booking attempt, in milliseconds.

  is_reschedule_request:
    description: Boolean flag indicating whether the attempt is a reschedule
      (rebook) of an existing booking rather than a new booking.

  product_name:
    description: Vendor-side product name sent with the booking request.

  ticket_delivery_type:
    description: |-
      Ticket delivery method requested. Possible values include: `MOBILE_TICKET`,
      `MOBILE_VOUCHER`, `PRINT_TICKET`, `ONLINE_VENUE_CHECK_IN`, `MOBILE_CODE`,
      `PRINT_VOUCHER`, `ORDER_NUMBER`, `MOBILE_EMAIL`, `NONE`.

  ticket_type:
    description: Ticket format requested from the vendor (e.g. `QRCODE`, `TEXT`,
      `HTML_URL`). Nullable.

  inventory_date:
    description: Date of the experience slot being booked (vendor-side inventory date).

  inventory_time:
    description: Time of the experience slot being booked (vendor-side inventory
      time, local to the experience).

  threshold_price_usd:
    description: Threshold price of the booking in USD, as sent to the vendor. Used
      by the fulfilment service to cap booking cost.

  threshold_price_local:
    description: Threshold price of the booking in the local currency sent to the vendor.

  threshold_price_local_currency:
    description: ISO currency code of `threshold_price_local`.

  vendor_order_id:
    format: ID
    description: Order id returned by the vendor in the booking response. Null for
      failed attempts and for vendors that do not return one.

  vendor_cancellation_id:
    format: ID
    description: Cancellation id returned by the vendor. Used to cancel the booking
      with the vendor later.

  count_tickets_issued:
    description: |-
      Number of entries in the vendor booking response `tickets` array. Always null for
      failed attempts. For successful attempts, some plugins return tickets outside this
      array (e.g. embedded in the vendor order payload), so a null or 0 value does not
      always mean no tickets were issued.

  vendor_booking_price:
    description: |-
      Actual price the vendor charged Headout for the booking, in `vendor_booking_currency`.
      Coalesced across plugin shapes: REZDY (`bookingContext.totalPrice.value`),
      INGRESSO/INGRESSOLE/NLIVEN/BMG/SPEKTRIX (`bookingContext.totalBookingPrice`),
      WELCOME3 (scalar `bookingContext.totalPrice`), PRE_PURCHASE/MOULIN_ROUGE/SPEKTRIX/TREEP
      (`bookingResponse.bookingAmount.value`). Together ~37% of plugin booking volume.
      Use this — not `threshold_price_local` — when comparing realised vendor cost vs threshold.

  vendor_booking_currency:
    description: ISO currency code of `vendor_booking_price`. Null for plugins that
      emit only a scalar amount with no currency.

  vendor_commission:
    description: Commission reported by the vendor in `bookingContext.commission`.
      Currently populated only by REZDY.

  vendor_seat_price:
    description: Seat-level price component reported by the vendor
      (`bookingContext.totalSeatPrice`). Currently populated only by INGRESSO
      and INGRESSOLE. Pairs with `vendor_surcharge` to break down
      `vendor_booking_price`.

  vendor_surcharge:
    description: Surcharge component reported by the vendor
      (`bookingContext.totalSurcharge`). Currently populated only by INGRESSO
      and INGRESSOLE.

  price_band:
    description: Vendor-side price band classification (`bookingContext.priceBand`).
      Currently populated only by INGRESSO (e.g. `A/pool`, `pb1/pool`,
      `<id>/pool`) and INGRESSOLE (e.g. `DUMMY`).

  markup_percentage:
    description: |-
      Markup percentage applied on top of net vendor price, from `bookingRequest.productCode.markupPercentage`.
      Expressed as a decimal (e.g. `0.1` = 10%). Sparsely populated (~13% of attempts), primarily
      for plugins that price net (BMG, REZDY, AV).

  offer_markup_percentage:
    description: Additional offer-time markup on top of `markup_percentage`
      (`productCode.offerMarkupPercentage`). Populated for ~12% of attempts
      (INGRESSO, INGRESSOLE, LINEUP).

  net_price_modifier:
    description: |-
      Net price modifier applied to the threshold price, from `bookingRequest.productCode.netPriceModifier`.
      Decimal multiplier (e.g. `0.9074` reduces threshold by ~9.26%). Sparsely populated (~3% of attempts).

  net_price_percentage:
    description: Net price as fraction of gross (`productCode.netPricePercentage`).
      Decimal (e.g. `0.85`). ~11% (INGRESSO, INGRESSOLE).

  net_price_addition_fee:
    description: Fixed fee added on top of net price
      (`productCode.netPriceAdditionFee`). ~11% of attempts; usually `0.0`.

  tax_fee:
    description: Vendor-side fixed tax fee (`productCode.taxFee`). ~11% of attempts;
      usually `0.0`.

  service_fee:
    description: Service fee (`productCode.serviceFee`). ~2% of attempts.

  is_net_price_used:
    description: Net-price pricing logic flag (`productCode.useNetPrice`). ~9% of
      attempts (VENTRATA-dominant).

  is_original_price_used:
    description: Original-price override flag (`productCode.useOriginalPrice`). ~9%
      (VENTRATA-only).

  insider_commission_discount_code:
    description: |-
      Discount code tied to a Headout insider commission deal with the vendor (e.g. `MNTHEADOUTSC25`).
      Extracted as the key from `productCode.insiderCommissionDiscountCode`. LINEUP-only.

  insider_commission_percentage:
    description: Insider commission rate paired with
      `insider_commission_discount_code`. Decimal (e.g. `0.10`).

  vendor_threshold:
    description: |-
      Vendor-side count threshold from `bookingRequest.productCode.threshold`. Small integer
      (typically `0`, `2`, or `6`) — distinct from the price-based thresholds. Populated for ~91% of attempts.

  is_retry_booking_enabled:
    description: |-
      Whether retry-on-failure is enabled for this plugin attempt
      (`bookingRequest.productCode.retryBookingConfiguration.hasRetryBookingEnabled`). Populated
      for ~90% of attempts; almost always `true` paired with `retry_slot_gap_mins=45`.

  retry_slot_gap_mins:
    description: |-
      Slot-gap window (minutes) used when retrying after failure
      (`bookingRequest.productCode.retryBookingConfiguration.slotGapInMins`). Common values:
      `45` (default), `30`, `60`. Populated for ~90% of attempts.

  has_live_inventory_check:
    description: |-
      Whether the plugin performs / supports a live inventory or availability check at booking time.
      Clubbed across four vendor-specific naming conventions: `productCode.hasLiveInventory`
      (GALAXY/INGRESSO/INGRESSOLE/PRIO2), `productCode.hasLiveInventoryCheck`
      (DISTRIBUSION/SINTRA/TourCMS), `productCode.hasLiveAvailabilityCheck`
      (FAREHARBOR/PRE_PURCHASE), and `productCode.hasFallbackLiveInventorySupportEnabled`
      (BOKUN-heavy fallback flag).

  vendor_ticket_mode:
    description: |-
      Vendor-side ticketing mode (`bookingRequest.productCode.ticketMode`). Values include
      `HEADOUT_TICKET`, `INGRESSO_TICKET`, `TOURCMS_TICKET`, `HO_TICKET`, `PDF_TICKET`,
      `ONLINE_VENUE_CHECK_IN`. Populated for ~23% of attempts.

  vendor_api_currency:
    description: Currency of the vendor API call
      (`bookingRequest.productCode.apiCurrency`). Populated for ~6% of attempts.

  vendor_external_id:
    format: ID
    description: |-
      Vendor's external identifier for the product/activity/rate/option being booked. Coalesced
      across `productCode.productId`, `activityId`, `rateId`, `optionId` in priority order.
      Pair with `vendor_external_id_type` to know which field was the source.

  vendor_external_id_type:
    description: Source field for `vendor_external_id`. One of `productId`,
      `activityId`, `rateId`, `optionId`.

  pax_type_map:
    description: |-
      JSON-encoded mapping between vendor pax-type codes and Headout pax types. Clubbed across
      `productCode.personTypeMap` (most plugins), `productCode.paxTypeMap` (BMG/EXPERIENCE_BANK/LINKTIVITY),
      and `productCode.personTypes` (BOKUN/CLORIAN). Direction varies by plugin so we preserve
      the raw map as a STRING for lossless inspection.

  is_delayed_fulfilment:
    description: PRE_PURCHASE-only flag (`productCode.delayedFulfilment`). Whether
      the booking goes via the delayed-fulfilment path.

  shared_product_code:
    description: PRE_PURCHASE-only (`productCode.sharedProductCode`). Shared product
      identifier across pre-purchase bookings.

  vendor_id_override:
    description: PRE_PURCHASE-only (`productCode.vendorIdOverride`). Override of the
      vendor PRE_PURCHASE routes to.

  is_non_contiguous_booking_blocked:
    description: PRE_PURCHASE-only flag
      (`productCode.failBookingForNonContiguousSeats`). Fail booking when
      requested seats are not contiguous.

  pax_types_for_pooled_inventory:
    description: PRE_PURCHASE-only (`productCode.paxTypesForPooledInventory`).
      JSON-encoded array of pax types sharing pooled inventory.

  vendor_delivery_method:
    description: VENTRATA-only (`productCode.deliveryMethod`). Values include
      `TICKET`, `VOUCHER`. Different from `ticket_delivery_type`.

  vendor_ticket_format:
    description: VENTRATA-only (`productCode.ticketFormat`). Values include
      `QRCODE`, `PDF_URL`, `SUPPLIER_REFERENCE_AS_QRCODE`. Different from
      `ticket_type`.

  vendor_supplier_id:
    format: ID
    description: GALAXY-only (`productCode.supplierId`). Underlying supplier behind
      the GALAXY vendor relationship.

  vendor_supplier_timezone_id:
    format: ID
    description: GALAXY-only (`productCode.supplierTimeZoneId`). Supplier-side timezone.

  vendor_continent:
    description: GALAXY-only (`productCode.continent`).

  has_flexi_schedule:
    description: GALAXY-only flag (`productCode.hasFlexiSchedule`).

  has_managed_capacity:
    description: GALAXY-only flag (`productCode.hasManagedCapacity`).

  is_same_day_ticket:
    description: GALAXY-only flag (`productCode.sameDayTicket`).

  vendor_event_id:
    format: ID
    description: INGRESSO / INGRESSOLE (`productCode.eventID`). Ingresso's event identifier.

  price_band_code:
    description: INGRESSO / INGRESSOLE (`productCode.priceBandCode`). User-set price
      band code, distinct from the vendor-emitted `price_band`.

  vendor_venue_id:
    format: ID
    description: INGRESSO / INGRESSOLE (`productCode.venueId`).

  vendor_ticket_type_code:
    description: INGRESSO / INGRESSOLE (`productCode.ticketTypeCode`).

  vendor_voucher_id_format:
    description: INGRESSO / INGRESSOLE (`productCode.voucherIdFormat`).

  min_participants_required:
    description: BOKUN-only (`productCode.minParticipantRequired`).

  vendor_target_date_format:
    description: BOKUN / DISTRIBUSION (`productCode.targetDateFormat`).

  vendor_product_code:
    description: TourCMS / BOOKINGKIT / PRE_PURCHASE (`productCode.code`).

  vendor_supplier_note:
    description: TourCMS-only (`productCode.supplierNote`).

  seatmap_clockwise_rotation:
    description: INGRESSO / INGRESSOLE / LINEUP
      (`productCode.seatmapData.clockwiseRotation`). Seatmap orientation hint.

  vendor_bookables:
    description: |-
      Per-seat / per-bookable detail sent to the vendor (`bookingRequest.vendorBookables`).
      ARRAY of STRUCTs; empty when the plugin does not select specific seats. Field set varies
      across plugins (INGRESSOLE adds `ticket_type_code` / `ticket_type_description`; AXS / AV /
      INGRESSO add `section`; AXS adds `seat_area` / `price_id`; some emit `seat_id` / `quote_id`).
      All struct fields are STRING for cross-plugin compatibility. Use `ARRAY_LENGTH(vendor_bookables)`
      for the per-attempt seat count.

  vendor_bookables_price_id:
    sql: price_id
    format: ID
    nested_on_field: vendor_bookables
    parent_field: vendor_bookables

  vendor_bookables_quote_id:
    sql: quote_id
    format: ID
    nested_on_field: vendor_bookables
    parent_field: vendor_bookables

  vendor_bookables_seat_area:
    sql: seat_area
    nested_on_field: vendor_bookables
    parent_field: vendor_bookables

  vendor_bookables_seat_area_display_name:
    sql: seat_area_display_name
    nested_on_field: vendor_bookables
    parent_field: vendor_bookables

  vendor_bookables_seat_description:
    sql: seat_description
    nested_on_field: vendor_bookables
    parent_field: vendor_bookables

  vendor_bookables_seat_id:
    sql: seat_id
    format: ID
    nested_on_field: vendor_bookables
    parent_field: vendor_bookables

  vendor_bookables_seat_number:
    sql: seat_number
    nested_on_field: vendor_bookables
    parent_field: vendor_bookables

  vendor_bookables_seat_row:
    sql: seat_row
    nested_on_field: vendor_bookables
    parent_field: vendor_bookables

  vendor_bookables_seat_row_display_name:
    sql: seat_row_display_name
    nested_on_field: vendor_bookables
    parent_field: vendor_bookables

  vendor_bookables_seat_type:
    sql: seat_type
    nested_on_field: vendor_bookables
    parent_field: vendor_bookables

  vendor_bookables_section:
    sql: section
    nested_on_field: vendor_bookables
    parent_field: vendor_bookables

  vendor_bookables_section_display_name:
    sql: section_display_name
    nested_on_field: vendor_bookables
    parent_field: vendor_bookables

  vendor_bookables_ticket_type_code:
    sql: ticket_type_code
    nested_on_field: vendor_bookables
    parent_field: vendor_bookables

  vendor_bookables_ticket_type_description:
    sql: ticket_type_description
    nested_on_field: vendor_bookables
    parent_field: vendor_bookables

  count_pax:
    description: |-
      Total pax across all person types in `bookingRequest.guestNumbersMap`
      (sum of ADULT, CHILD, INFANT, SENIOR, YOUTH, GENERAL, etc.). Computed by summing
      the integer values in the map; the map has 60+ heterogeneous person-type keys so
      individual types are not broken out as columns.

  failure_reason:
    description: Raw failure reason returned by the vendor or the plugin. Populated
      only when `status = 'FAIL'`.

  failure_stack_trace:
    description: Full stack trace captured when the plugin raised an exception.
      Populated only for exception-driven failures.

measures:
  count:
    aggregate_type: count
