  domain_id:
    format: ID
    description: id of the domain order transaction took place

  domain_host:
    description: domain host on which the order transaction took place

  order_status:
    description: current status of the order

  order_value:
    description: total value of the order to be paid by the customer in processing
      (tour) currency

  order_value_usd:
    description: total value of the order to be paid by the customer in USD

  processing_currency:
    description: currency in which the order is processed by Headout (tour currency)

  price_payable:
    description: price payable in process currency after applying coupon discount

  price_payable_usd:
    description: price payable in USD after applying coupon discount

  distribution_partner_net_price:
    description: |-
      Distribution Partner Net Price (DPNP) in tour currency — the discounted amount
      a B2B partner (API or Agent) actually pays. Aggregated from booking-level data
      for completed/pending bookings. 0 for B2C orders. Distinct from order_value
      for post-2025-07-25 B2B orders where order_value includes price_markdown to
      reach Headout Selling Price (GBV).

  distribution_partner_net_price_usd:
    description: |-
      Distribution Partner Net Price (DPNP) in USD. Derived from
      distribution_partner_net_price * conversion_rate_to_usd. 0 for B2C orders.

  price_net:
    description: net price paid to the vendor in the processing currency

  price_net_usd:
    description: net price paid to the vendor in USD

  amount_coupon_discount:
    description: discount amount the user got after successfully applying the coupon

  amount_cart_discount:
    description: discount amount the user gets when adding multiple things in the
      cart (started after proj cross sell)

  promo_discount:
    description: smart pricing promo discount applied on the product

  audio_guide_provider:
    description: name of the audio guide provider

  amount_coupon_discount_usd:
    description: discount amount in USD the user got after successfully applying the coupon

  amount_cart_discount_usd:
    description: discount amount in USD the user gets when adding multiple things in
      the cart (started after proj cross sell)

  amount_concierge_commission:
    description: concierge commission amount to be paid out to the concierge for this order

  amount_concierge_commission_usd:
    description: concierge commission amount in USD to be paid out to the concierge
      for this order

  conversion_rate_to_usd:
    description: processing currency to usd conversion rate used for this order

  amount_direct_costs:
    description: direct cost amount calculated for this order

  amount_direct_costs_usd:
    description: direct cost amount calculated for this order in USD

  order_pay_later_id:
    format: ID

  payment_id:
    format: ID
    description: unique identifier for each payment on the payment gateway

  payment_amount:
    description: amount the payment was initially authorised for

  payment_amount_received:
    description: amount received after captures, voids and refunds

  payment_amount_received_usd:
    description: amount received in usd after captures, voids and refunds

  card_issuing_country:
    description: name of the country where the card used for making the order was issued

  payment_gateway:
    description: name of the payment gateway

  coupon_code:
    description: coupon code applied by the user for making the order

  is_affiliate_coupon:
    description: boolean describing whether the coupon code used is an affiliate
      coupon or not

  is_city_card_coupon:
    description: boolean flag for City Card fulfillment bookings identified by HOCC
      coupon code prefix. These are internal bookings made by Headout to fulfil
      City Card orders using 100% discount codes, and are excluded from market
      P&L reporting.

  device:
    description: device used to make the order by the user

  is_logged_in:
    description: bool describing whether the user was logged in while making the
      order or not!

  user_type:
    description: type of user making the order

  email:
    description: email of the customer making the order

  name:
    description: name of the customer making the order

  fingerprint_id:
    format: ID
    description: fingerprint id (unique identifier for a user) associated with that order

  partner_name:
    description: Valid only for the non Customer calipso users. Name of the parent
      company (vendor or hotel or affiliate network) for this user.

  amount_operating_cost:
    description: |-
      Order-level operating cost in tour (processing) currency. Summed from
      booking-level calculations so combo orders with mixed is_partnered/validity_type
      values are handled correctly per booking. Rates: non-partnered or PP DATE_TIME
      → 15% of margin, PP OPEN → 8% of margin. Only applied to completed bookings.

  amount_operating_cost_usd:
    description: |-
      Order-level operating cost in USD. Summed from booking-level calculations so
      combo orders with mixed is_partnered/validity_type values are handled correctly
      per booking. Rates: non-partnered or PP DATE_TIME → 15% of margin, PP OPEN →
      8% of margin. Only applied to completed bookings.

  wallet_credits:
    description: wallet credits used in processing currency to pay for this order

  wallet_credits_usd:
    description: wallet credits used in USD to pay for this order

  wallet_transactions:
    description: an array of all wallet transactions associated with the order

  wallet_transactions_amount:
    sql: amount
    nested_on_field: wallet_transactions
    parent_field: wallet_transactions

  wallet_transactions_amount_usd:
