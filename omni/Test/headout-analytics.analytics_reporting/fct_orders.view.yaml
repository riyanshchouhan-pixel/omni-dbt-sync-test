  session_traffic_source:
    description: traffic source for the session based on utm parameters

  session_traffic_medium:
    description: traffic medium for the session based on utm parameters

  session_campaign_name:
    description: name of the campaign for the session based on utm parameters

  session_keyword:
    description: keyword used for displaying the result clicked by the user to start
      the session

  session_ad_content:
    description: ad content for the ad clicked by the user to start the session

  session_referrer:
    description: website from which the user came to headout to start their session

  session_adwords_ad_group_id:
    format: ID
    description: google ads ad group id associated with the google ads ad group the
      session was attributed to by google analytics

  session_adwords_campaign_id:
    format: ID
    description: google ads campaign id associated with the google ads campaign the
      session was attributed to by google analytics

  session_adwords_customer_id:
    format: ID
    description: google ads customer (account) id associated with the google ads
      account the session was attributed to by google analytics

  session_ad_matched_query:
    description: user's query which matched with the keyword to display the ad /
      result to start the session

  session_landing_page:
    description: page on which the user entered headout's wesbite to start the session

  session_landing_page_host:
    description: host name for the landing page for the session

  session_num_pages_visited:
    description: number of pages visited by the user in the session

  session_traffic_origin_country:
    description: country name from where the traffic was originating for the session

  session_traffic_channel_grouping:
    description: channels grouped together based on medium

  distribution_partner_tier_id:
    format: ID

  tier_id:
    format: ID

  order_value_completed:
    description: |-
      Completed value of the order in processing (tour) currency, on Headout Selling
      Price (HSP) basis. For B2B AGENT/API_PARTNER orders with `created_at >= '2025-07-25'`,
      includes `price_markdown` so the value reflects HSP — mirroring the workaround
      applied to `order_value` in `stg_database__orders`. For all other orders, equals
      payment amount received (after refunds) plus coupon discount plus wallet credits.

  order_value_completed_usd:
    description: |-
      Completed value of the order in USD, on Headout Selling Price (HSP) basis.
      For B2B AGENT/API_PARTNER orders with `created_at >= '2025-07-25'`, includes
      `price_markdown_usd` so the value reflects HSP — mirroring the workaround
      applied to `order_value_usd` in `stg_database__orders`. For all other orders,
      equals payment amount received in USD (after refunds) plus coupon discount
      plus wallet credits.

  customer_order_sequence_number:
    description: the order number in sequence for the customer

  is_repeat_order:
    description: boolean specifying whether the order was from a repeating customer or not

measures:
  count:
    aggregate_type: count
