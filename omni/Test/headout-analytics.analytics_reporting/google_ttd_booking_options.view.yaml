# Reference this view as headout_analytics_analytics_reporting__google_ttd_booking_options
description: None

catalog: headout-analytics
schema: analytics_reporting
table_name: google_ttd_booking_options

dimensions:
  country: {}
  tour_operator_name: {}
  local_currency: {}
  conversion_rate: {}
  metadata: {}

  surrogate_key:
    description: surrogate primary key built by combining last_extracted_date,
      gmap_url, rank, sub_rank

  combined_entity_id:
    format: ID
    description: Headout CE id of the given tour

  gmap_url:
    description: Google map search URL used to fetch the TTD experiences results

  rank:
    description: Rank of the company that appeared on the Booking Options section of
      the google search results

  company_name:
    description: Name of the company that appears on google search results in
      Booking Options section

  is_official_site:
    description: Check if the TTD result is from official site

  sub_rank:
    description: Sub Rank of the products provided by companies

  experience_id:
    format: ID
    description: Headout TGID extracted from the product_url

  correct_tgid:
    description: Headout TGID that is expected to be part of the admissions result

  product_name:
    description: Name of the products provided by companies

  product_url:
    description: URL of the products listed

  currency:
    description: Currency is by default EUR, because of the location the VM is hosted

  price:
    description: Price of the products listed

  promo:
    description: Aggregate data of smart pricing promo details including active
      status, discount, and local/non-local classification

  promo_is_active:
    sql: is_active
    nested_on_field: promo
    parent_field: promo

  promo_promo_code:
    sql: promo_code
    nested_on_field: promo
    parent_field: promo

  promo_promo_discount_value:
    sql: promo_discount_value
    nested_on_field: promo
    parent_field: promo

  promo_promo_id:
    sql: promo_id
    format: ID
    nested_on_field: promo
    parent_field: promo

  promo_promo_location:
    sql: promo_location
    nested_on_field: promo
    parent_field: promo

  last_extracted_date:
    description: date (utc) on which this row was extracted

measures:
  count:
    aggregate_type: count
