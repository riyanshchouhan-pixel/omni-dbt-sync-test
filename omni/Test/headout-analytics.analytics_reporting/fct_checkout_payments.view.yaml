# Reference this view as headout_analytics_analytics_reporting__fct_checkout_payments
description: None

catalog: headout-analytics
schema: analytics_reporting
table_name: fct_checkout_payments

dimensions:
  response_code: {}
  payment_status: {}
  amount_refunded: {}
  amount_refunded_usd: {}
  payment_refunded_at: {}
  order_combined_entity_name: {}
  is_mit_auth_payment: {}
  is_mit_booking_payment: {}

  payment_id:
    format: ID
    description: unique identifier for each payment on checkout

  created_at:
    description: timestamp at which the payment was created (UTC)

  amount_in_cents:
    description: amount in currency's smallest unit

  amount:
    description: amount in decimal

  currency:
    description: processing currency for the payment on checkout

  amount_usd:
    description: amount in usd converted using currency conversion from currency
      conversion rates API

  payment_method:
    description: type of payment method used by the customer (visa, mastercard,
      iDeal, PayPal etc.)

  response_message:
    description: response message received for the auth event from checkout

  is_authorized:
    description: bool representing whether the payment was successfully authorized
      on checkout

  amount_captured:
    description: amount successfully captured for this payment

  order_id:
    format: ID
    description: headout order Id for the payment

  order_city:
    description: name of the city with the linked order

  order_country:
    description: name of the country for the linked order

  order_experience_name:
    description: headout experience name associated with the order

  order_experience_id:
    format: ID
    description: headout experience id associated with the order

  order_combined_entity_id:
    format: ID

  is_micro_auth_payment:
    description: bool representing whether the payment was a micro auth payment or not

  customer_email:
    description: customer email making the order associated with the payment

  customer_ip:
    description: IP address of the customer while making the payment

  card_network:
    description: name of the card network (scheme) used to make the payment. visa,
      mastercard etc

  card_bin:
    description: first 6 digits of the card number used for making the payment

  card_customer_name:
    description: name of the customer on the card used for making the payment

  card_type:
    description: type of card used for making the payment; credit vs debit

  card_product_name:
    description: name of the card product used for making the payment

  card_category:
    description: consumer card vs corportate card

  card_issuing_bank:
    description: name of the card issuing bank

  card_issuing_country_code:
    description: iso2 code for the country issuing the card

  card_issuing_country:
    description: name of the country issuing the card

  card_wallet_type:
    description: type of card wallet used used by the customer (e.g. - ApplePay, GooglePay)

  has_three_ds:
    description: bool representing whether the payment request had 3ds

  is_three_ds_downgraded:
    description: bool representing whether the 3ds request was downgraded or not

  three_ds_eci:
    description: eci code returned in the 3ds response;
      https://docs.checkout.com/docs/3d-secure-payments#section-electronic-commerce-indicator-eci-values

  three_ds_enrolled:
    description: whether the card is enrolled in 3ds scheme or not

  three_ds_signature_valid:
    description: whether the 3ds signature was valid or not

  is_three_ds_challenged:
    description: whether the 3ds attempt went through the challange flow or not

  three_ds_requestor_challenge_indicator:
    description: whether the merchant (Headout) had a preference for Challenge or not

  three_ds_directory_response:
    description: 3ds response from the card scheme

  three_ds_authentication_response:
    description: whether the 3ds authentication was done successfully

  three_ds_cavv:
    description: 3ds cryptogram

  three_ds_xid:
    description: 3ds xid

  three_ds_version:
    description: 3ds version used for completing the request

  sift_score:
    description: fraud score Sift gave to this payments

  sift_decision:
    description: did Sift mark the payment as RISKY or NORMAL

  api_version:
    description: checkout api version used for the payment

measures:
  count:
    aggregate_type: count
