# Reference this view as headout_analytics_analytics_reporting__fct_reviews
description: None

catalog: headout-analytics
schema: analytics_reporting
table_name: fct_reviews

dimensions:
  is_hidden: {}
  content_length: {}
  review_summary: {}

  review_id:
    format: ID
    description: unique id for each review, same as booking id

  booking_id:
    format: ID
    description: booking id for the booking reviewed

  reviewed_at:
    description: ts (utc) at which the review was submitted

  rating:
    description: rating submitted by the guest

  source:
    description: source of the ratings

  review:
    description: review text by the guest

  has_media:
    description: Boolean indicating if the review has associated media

  table_source:
    description: field to identify which table is the ratings coming from

  review_media:
    description: Array of Media Assets of the given review

  review_media_media_reviewer:
    sql: media_reviewer
    nested_on_field: review_media
    parent_field: review_media

  review_media_media_type:
    sql: media_type
    nested_on_field: review_media
    parent_field: review_media

  review_media_media_url:
    sql: media_url
    nested_on_field: review_media
    parent_field: review_media

  review_media_review_media_id:
    sql: review_media_id
    format: ID
    nested_on_field: review_media
    parent_field: review_media

  review_media_status:
    sql: status
    nested_on_field: review_media
    parent_field: review_media

  tagged_at:
    description: ts (utc) at which the review was tagged by Vectorshift Pipeline.

  issues:
    description: Array struct for L1-L2 issues tagged by Vectorshift.

  issues_l1_issue:
    sql: l1_issue
    nested_on_field: issues
    parent_field: issues

  issues_l2_issues:
    sql: l2_issues
    nested_on_field: issues
    parent_field: issues

  dissatisfaction_reasons:
    description: Array struct for L1-L2 reasons for guided and audio guided TGIDs.

  dissatisfaction_reasons_sublevelreasons:
    sql: sublevelreasons
    nested_on_field: dissatisfaction_reasons
    parent_field: dissatisfaction_reasons

  dissatisfaction_reasons_toplevelreason:
    sql: toplevelreason
    nested_on_field: dissatisfaction_reasons
    parent_field: dissatisfaction_reasons

  booking_risk_score:
    description: Risk score assigned to the booking by the reviews RCA agent.

  is_high_risk_booking:
    description: Boolean flag indicating whether the booking is classified as high
      risk by the RCA agent.

  review_rate:
    description: Review rate score produced by the RCA agent.

  support_rate:
    description: Support rate score produced by the RCA agent.

  is_escalate_variant:
    description: Boolean flag indicating whether the booking should be escalated per
      the RCA agent.

  is_structural_supported:
    description: Boolean flag indicating whether the booking is structurally
      supported per the RCA agent.

  sub_theme:
    description: Sub-theme classification assigned by the RCA agent.

  has_severe_issue:
    description: Boolean flag indicating whether the booking has a severity issue
      per the RCA agent.

  missing_fields:
    description: Array of the missing fields like redemption_instructions, on-ground
      contact, etc that were not shared with customer resulting in confusion.

  review_source:
    description: Source channel through which the review was solicited

  review_medium:
    description: Medium through which the review was solicited

  review_campaign:
    description: Campaign associated with the review solicitation

  review_term:
    description: Term parameter associated with the review solicitation

  review_content:
    description: Content parameter associated with the review solicitation

measures:
  count:
    aggregate_type: count
