# Reference this view as headout_analytics_analytics_reporting__page_country_performance
description: None

catalog: headout-analytics
schema: analytics_reporting
table_name: page_country_performance

dimensions:
  surrogate_key:
    description: Surrogate primary key derived from report_date, page,
      country_iso3_code, and search_type.

  report_date:
    description: Date for which the search performance data is recorded.

  site:
    description: The Search Console property (site URL). Normalized to always end
      with a trailing slash.

  page:
    description: Full URL of the page that appeared in search results.

  search_type:
    description: Type of Google search result. Possible values include 'web',
      'image', 'video', 'news'.

  iso3_code:
    description: ISO 3166-1 alpha-3 country code (e.g. 'gbr', 'usa') indicating
      where the search originated.

  country:
    description: Full country name resolved from iso3_code via the countries dimension.

  count_impressions:
    description: Number of times the page appeared in search results in the given
      country on this date.

  count_clicks:
    description: Number of times a user clicked through to the page from search
      results in the given country on this date.

  avg_position:
    description: Average position of the page in search results for the given
      country on this date. Lower values indicate higher ranking.

measures:
  count:
    aggregate_type: count
