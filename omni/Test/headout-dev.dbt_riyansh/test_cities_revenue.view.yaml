# Reference this view as headout_dev_dbt_riyansh__test_cities_revenue
catalog: headout-dev
schema: dbt_riyansh
table_name: test_cities_revenue

dimensions:
  city_name: {}
  revenue: {}

  country_name:
    label: Country Name [TEST 22 CUSTOM]

measures:
  count:
    aggregate_type: count

#The info below was pulled from your dbt repository and is read-only.
dbt:
  name: test_cities_revenue
  target_schema: dbt_riyansh
  config:
    materialized: view
  code: |-
    {{ config(materialized='view') }}

    select
        'Amsterdam' as city_name,
        100.50 as revenue
    union all
    select 'Paris', 250.75
    union all
    select 'Tokyo', 500.00
