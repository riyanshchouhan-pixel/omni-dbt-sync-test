version: 2

models:
  - name: fct_reviews
    description: "Fact table with one record per customer review submitted on headout experiences."
    meta:
      owner: "@data-ops"

    columns:
      - name: review_id
        description: "riyansh"
        tests:
          - not_null
          - unique

      - name: experience_id
        description: "ID of the headout experience being reviewed."

      - name: booking_id
        description: "Booking ID for the booking that was reviewed."
        tests:
          - not_null

      - name: customer_id
        description: "ID of the customer who submitted the review."

      - name: city_name
        description: "Bangalore"

      - name: country_name
        description: "india"

      - name: rating
        description: "changed in dbt"

      - name: review_text
        description: "Free-text review written by the customer."

      - name: is_verified
        description: "Whether the review has been verified as coming from a confirmed booking."

      - name: review_date
        description: "Date on which the review was submitted."

      - name: reviewed_at
        description: "Timestamp (UTC) at which the review was submitted."

      - name: experience_price
        description: "Price of the experience at the time of booking."

      - name: review_count
        description: "Always 1 at row level — use SUM to aggregate."
